<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register | HallBook</title><link rel="stylesheet" href="/css/style.css"></head>
<body><main class="auth"><div class="auth-card"><a class="brand" href="/">Hall<span>Book</span></a><h1>Create account</h1><form id="registerForm">
<input id="name" placeholder="Full name" required minlength="2">
<input id="email" type="email" placeholder="Email" required>
<input id="phone" placeholder="10-digit phone" pattern="[0-9]{10}" required>
<input id="password" type="password" placeholder="Password (min 6 chars)" minlength="6" required>
<button>Register</button><p id="msg" class="msg"></p></form><p>Already registered? <a href="/login.html">Login</a></p></div></main>
<script>
registerForm.onsubmit=async e=>{e.preventDefault();msg.textContent='';
const payload={name:name.value.trim(),email:email.value.trim(),phone:phone.value.trim(),password:password.value};
const r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
const d=await r.json();if(r.ok){alert('Registration successful. Please login.');location.href='/login.html'}else msg.textContent=d.message||'Registration failed';};
</script></body></html>
