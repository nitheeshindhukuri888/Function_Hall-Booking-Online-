<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | HallBook</title><link rel="stylesheet" href="/css/style.css"></head>
<body><main class="auth"><div class="auth-card"><a class="brand" href="/">Hall<span>Book</span></a><h1>Welcome back</h1><p>Login to manage your bookings.</p>
<form id="loginForm">
<input id="email" type="email" placeholder="Email" required>
<input id="password" type="password" placeholder="Password" required>
<button>Login</button><p id="msg" class="msg"></p>
</form><p>New user? <a href="/register.html">Create an account</a></p></div></main>
<script>
loginForm.onsubmit=async e=>{e.preventDefault();msg.textContent='';
const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});
const d=await r.json(); if(r.ok){localStorage.setItem('user',JSON.stringify(d.user));location.href='/dashboard.html'}else msg.textContent=d.message||'Login failed';};
</script></body></html>
