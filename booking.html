<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book Hall | HallBook</title><link rel="stylesheet" href="/css/style.css"><script src="https://checkout.razorpay.com/v1/checkout.js"></script></head>
<body><header class="nav"><a class="brand" href="/">Hall<span>Book</span></a><nav><a href="/">Home</a><a href="/dashboard.html">Dashboard</a></nav></header>
<main class="section narrow"><div class="form-card"><p class="eyebrow">SECURE BOOKING</p><h1 id="title">Book your hall</h1><p id="price"></p>
<form id="bookingForm">
<input type="date" id="eventDate" required>
<select id="eventType" required><option value="">Event type</option><option>Wedding</option><option>Reception</option><option>Birthday</option><option>Engagement</option><option>Corporate</option><option>Other</option></select>
<input type="number" id="guestCount" min="1" placeholder="Number of guests" required>
<input id="customerName" placeholder="Customer name" required>
<input id="customerPhone" placeholder="10-digit phone" pattern="[0-9]{10}" required>
<input id="customerEmail" type="email" placeholder="Email" required>
<textarea id="notes" placeholder="Additional requirements"></textarea>
<button>Continue to secure payment</button><p id="msg" class="msg"></p>
</form></div></main>
<script>
const user=JSON.parse(localStorage.getItem('user')||'null'); const hallId=new URLSearchParams(location.search).get('hallId');
if(!user){alert('Please login first');location.href='/login.html'}
let hall;
async function start(){const r=await fetch('/api/halls/'+hallId);hall=await r.json();title.textContent='Book '+hall.name;price.textContent='₹'+Number(hall.pricePerDay).toLocaleString('en-IN')+' / day';eventDate.min=new Date().toISOString().split('T')[0];customerName.value=user.name;customerEmail.value=user.email;customerPhone.value=user.phone;}start();
bookingForm.onsubmit=async e=>{e.preventDefault();msg.textContent='';
const payload={hallId:Number(hallId),eventDate:eventDate.value,eventType:eventType.value,guestCount:Number(guestCount.value),customerName:customerName.value.trim(),customerPhone:customerPhone.value.trim(),customerEmail:customerEmail.value.trim(),notes:notes.value.trim()};
const r=await fetch('/api/bookings?userId='+user.id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok){msg.textContent=d.message||'Booking failed';return}
const pr=await fetch('/api/payments/order/'+d.bookingId,{method:'POST'});const po=await pr.json();if(!pr.ok){msg.textContent=po.message;return}
new Razorpay({key:po.keyId,amount:po.amount,currency:po.currency,name:'HallBook',description:'Function hall booking',order_id:po.orderId,prefill:{name:user.name,email:user.email,contact:user.phone},
handler:async function(resp){const vr=await fetch('/api/payments/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bookingId:String(d.bookingId),razorpay_order_id:resp.razorpay_order_id,razorpay_payment_id:resp.razorpay_payment_id,razorpay_signature:resp.razorpay_signature})});const x=await vr.json();if(vr.ok){alert('Payment verified. Booking confirmed!');location.href='/dashboard.html'}else msg.textContent=x.message||'Payment verification failed';}
}).open();
};
</script></body></html>
