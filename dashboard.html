<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard | HallBook</title><link rel="stylesheet" href="/css/style.css"></head>
<body><header class="nav"><a class="brand" href="/">Hall<span>Book</span></a><nav><a href="/">Home</a><a href="/admin.html">Admin</a><button class="linkbtn" onclick="logout()">Logout</button></nav></header>
<main class="section"><p class="eyebrow">ACCOUNT</p><h1 id="welcome">My bookings</h1><div id="bookings" class="booking-list"></div></main>
<script>
const user=JSON.parse(localStorage.getItem('user')||'null');if(!user)location.href='/login.html';welcome.textContent='Hello, '+user.name;
function logout(){localStorage.removeItem('user');location.href='/';}
async function cancelBooking(id){if(!confirm('Cancel this booking? A paid booking will request a gateway refund.'))return;const r=await fetch(`/api/bookings/${id}/cancel?userId=${user.id}`,{method:'POST'});const d=await r.json();alert(d.message||'Done');load();}
async function load(){const r=await fetch('/api/bookings/user/'+user.id);const bs=await r.json();bookings.innerHTML=bs.length?bs.map(b=>`<article class="booking"><div><b>Booking #${b.id}</b><p>Date: ${b.eventDate} • Event: ${b.eventType}</p><p>Guests: ${b.guestCount} • Amount: ₹${Number(b.totalAmount).toLocaleString('en-IN')}</p></div><div><span class="badge ${b.paymentStatus==='PAID'?'paid':''}">${b.status}</span>${b.status!=='CANCELLED'?`<br><button class="danger" onclick="cancelBooking(${b.id})">Cancel</button>`:''}</div></article>`).join(''):'<p>No bookings yet. <a href="/">Browse halls</a></p>'}load();
</script></body></html>
